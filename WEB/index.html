<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=./Keyboard/" />
  <title>WEB — projets</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0e1116; color:#e6edf3; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .box { text-align:center; padding:24px; }
    a { color:#2f81f7; font-weight:600; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .muted { color:#8b949e; font-size:13px; margin-top:12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Projets WEB</h1>
    <p>Redirection vers le projet par défaut : <a href="./Keyboard/">Keyboard</a>…</p>
    <p class="muted">Si rien ne se passe, cliquez sur le lien ci-dessus.</p>
  </div>
  <script>
    // Redirection immédiate vers le projet par défaut.
    // On propage la query string (?D=…) pour ne pas perdre le paramètre du transport Wi-Fi.
    location.replace('./Keyboard/' + location.search);
  </script>
</body>
</html>
