<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>S3-KBD — Connexion Wi-Fi</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0e1116; color:#e6edf3; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
           padding:24px; }
    .card { width:100%; max-width:420px; text-align:center; background:#161b22; border:1px solid #30363d;
            border-radius:16px; padding:28px 24px; }
    .logo { font-size:44px; line-height:1; }
    h1 { margin:10px 0 6px; font-size:22px; letter-spacing:.5px; }
    p { color:#8b949e; font-size:14px; line-height:1.5; margin:8px 0; }
    .btn { display:block; width:100%; margin:20px 0 12px; padding:14px 18px; font-size:17px; font-weight:600;
           color:#fff; background:#2f81f7; border:none; border-radius:10px; cursor:pointer; }
    .btn:active { background:#2368c9; }
    .link { display:inline-block; margin-top:6px; color:#2f81f7; font-size:14px; text-decoration:none; }
    .link:active { text-decoration:underline; }
    .muted { color:#6e7681; font-size:12px; margin-top:16px; word-break:break-all; }
    .hint { color:#8b949e; font-size:12px; margin-top:14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">📡</div>
    <h1>S3-KBD</h1>
    <p>Clavier et souris USB pilotés en Wi-Fi.<br>Appuyez sur « Accepter » pour ouvrir la télécommande.</p>

    <button id="ok" class="btn">Accepter</button>
    <a id="open" class="link" href="#">Ouvrir dans le navigateur</a>

    <p class="hint" id="ioshint" hidden>Sur iPhone, si la télécommande ne se connecte pas dans cette
      fenêtre, touchez « Ouvrir dans le navigateur » (Safari).</p>
    <p class="muted" id="info"></p>
  </main>

  <script>
    // base64url (sans padding) de la chaîne UTF-8 passée.
    var b64url = function (s) {
      return btoa(unescape(encodeURIComponent(s)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    // Construit l'URL cible : http://<S3>/Keyboard/?D=<base64url(JSON)>.
    // date = heure du TÉLÉPHONE (le S3 n'a pas d'horloge réelle hors ligne).
    function buildURL() {
      var ip = location.hostname || '192.168.4.1';
      var D  = b64url(JSON.stringify({ wifi: ip, date: new Date().toISOString() }));
      return location.protocol + '//' + location.host + '/Keyboard/?D=' + D;
    }
    var okBtn = document.getElementById('ok');
    var openLink = document.getElementById('open');
    function refresh() { var u = buildURL(); openLink.href = u; return u; }
    okBtn.addEventListener('click', function () { location.href = refresh(); });
    openLink.addEventListener('click', function (e) { e.preventDefault(); location.href = refresh(); });
    refresh();
    document.getElementById('info').textContent = 'Hôte : ' + location.host;
    // Indice iOS (mini-navigateur captif restreint).
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      document.getElementById('ioshint').hidden = false;
    }
  </script>
</body>
</html>
